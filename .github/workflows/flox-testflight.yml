name: Flox TestFlight Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (auto-incremented if empty)'
        required: false
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          brew update
          brew install xcodegen pkl

      - name: Generate Secrets
        run: |
          # Flox: analytics/sentry disabled, only MapLibre key needed
          cat > Secrets/Secrets.swift << 'EOF'
          enum Secrets {
              static let sentryDSN: String? = nil
              static let sentryRustDSN: String? = nil
              static let postHogHost: String? = nil
              static let postHogAPIKey: String? = nil
              static let rageshakeURL: String? = nil
              static let mapLibreAPIKey: String? = "${{ secrets.MAPLIBRE_API_KEY }}"
          }
          EOF

      - name: Generate Xcode project
        run: xcodegen

      - name: Determine build number
        id: build_number
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            echo "number=${{ inputs.build_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
          NSE_PROVISIONING_PROFILE_BASE64: ${{ secrets.NSE_PROVISIONING_PROFILE }}
          SHARE_PROVISIONING_PROFILE_BASE64: ${{ secrets.SHARE_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PP_PATH=$RUNNER_TEMP/main.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision

          if [ -n "$NSE_PROVISIONING_PROFILE_BASE64" ]; then
            NSE_PP_PATH=$RUNNER_TEMP/nse.mobileprovision
            echo -n "$NSE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $NSE_PP_PATH
            NSE_PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $NSE_PP_PATH))
            cp $NSE_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$NSE_PP_UUID.mobileprovision
          fi

          if [ -n "$SHARE_PROVISIONING_PROFILE_BASE64" ]; then
            SHARE_PP_PATH=$RUNNER_TEMP/share.mobileprovision
            echo -n "$SHARE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $SHARE_PP_PATH
            SHARE_PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $SHARE_PP_PATH))
            cp $SHARE_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$SHARE_PP_UUID.mobileprovision
          fi

      - name: Build archive
        run: |
          xcodebuild archive \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Flox.xcarchive \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.number }} \
            MARKETING_VERSION=1.0.0 \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Flox.xcarchive \
            -exportPath $RUNNER_TEMP/FloxExport \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          # Create API key file
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/FloxExport/Flox.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
